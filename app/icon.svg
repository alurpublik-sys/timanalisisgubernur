<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tim Analisis">
  <defs>
    <linearGradient id="bg" x1="56" y1="34" x2="456" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07182B"/>
      <stop offset=".54" stop-color="#082B4C"/>
      <stop offset="1" stop-color="#0B3B62"/>
    </linearGradient>
    <linearGradient id="blue" x1="108" y1="116" x2="385" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1474F5"/>
      <stop offset=".38" stop-color="#0B49A4"/>
      <stop offset="1" stop-color="#061C3E"/>
    </linearGradient>
    <linearGradient id="navy" x1="315" y1="102" x2="421" y2="392" gradientUnits="userSpaceOnUse">
