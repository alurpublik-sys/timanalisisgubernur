  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#glow)"/>
  <rect x="30" y="30" width="452" height="452" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity=".075" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- T -->
    <path d="M90 140c0-16 13-29 29-29h210l-35 52c-9 14-24 22-41 22H90z" fill="url(#blue)"/>
    <path d="M179 177h70v174c0 27-16 51-41 61l-29 12z" fill="url(#blue)"/>

