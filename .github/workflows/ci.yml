name: AH Center CI

on:
  push:
    branches: ["feat/ah-center-fullstack"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      ADMIN_PIN: "000000"
      AH_SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      APP_TIMEZONE: Asia/Makassar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Supabase migration versions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if (( ${#files[@]} == 0 )); then
            echo "::error::No Supabase migrations found"
            exit 1
          fi
          versions=()
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            if [[ ! "$name" =~ ^([0-9]{14})_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$file::Migration filename must use 14-digit timestamp and snake_case name"
              exit 1
            fi
            versions+=("${BASH_REMATCH[1]}")
          done
          duplicates="$(printf '%s\n' "${versions[@]}" | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "::error::Duplicate migration versions: $duplicates"
            exit 1
          fi
          echo "Validated ${#files[@]} unique migration versions."
      - name: Ensure dependency lockfile
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add dependency lockfile [skip ci]"
            git push
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
