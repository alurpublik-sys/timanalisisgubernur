name: Strategic Team Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches: ["main", "feat/admin-lock-premium-ui"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://suiiaiuxkhdsqufswpfv.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dtMWWlvdj-Qzui7DFQfGTw_SRlc5SDh
      APP_TIMEZONE: Asia/Makassar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start production server and verify public app + protected settings
        run: |
          set -euo pipefail
          npm start > /tmp/ah-center-next.log 2>&1 &
          ready=0
          for i in {1..30}; do
            status=$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' http://127.0.0.1:3000/dashboard || true)
            if [ "$status" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat /tmp/ah-center-next.log; exit 1; fi
          grep -q 'Dashboard Strategis' /tmp/dashboard.html
          echo 'Public dashboard returned HTTP 200'
          settings_status=$(curl -sS -o /tmp/settings.html -D /tmp/settings.headers -w '%{http_code}' http://127.0.0.1:3000/pengaturan || true)
          test "$settings_status" = "307"
          grep -Eiq '^location: .*/login' /tmp/settings.headers
          echo 'Pengaturan redirects unauthenticated requests to /login'
          login_status=$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:3000/login || true)
          test "$login_status" = "200"
          grep -q 'Masukkan PIN Admin' /tmp/login.html
          echo 'PIN admin route returned HTTP 200'
          findings_status=$(curl -sS -o /tmp/findings.html -D /tmp/findings.headers -w '%{http_code}' http://127.0.0.1:3000/temuan-opd || true)
          test "$findings_status" = "307"
          grep -Eiq '^location: .*/login' /tmp/findings.headers
          echo 'Temuan OPD redirects unauthenticated requests to PIN login'
