name: AH Center Runtime Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://suiiaiuxkhdsqufswpfv.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dtMWWlvdj-Qzui7DFQfGTw_SRlc5SDh
      APP_TIMEZONE: Asia/Makassar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start production server and verify login boundary
        run: |
          set -euo pipefail
          npm start > /tmp/ah-center-next.log 2>&1 &
          echo $! > /tmp/ah-center-next.pid

          ready=0
          for i in {1..30}; do
            status=$(curl -sS -o /tmp/login.html -w '%{http_code}' http://127.0.0.1:3000/login || true)
            if [ "$status" = "200" ]; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo '--- next server log ---'
            cat /tmp/ah-center-next.log
            echo '--- login response ---'
            cat /tmp/login.html || true
            exit 1
          fi
          echo 'Login route returned HTTP 200'

          dashboard_status=$(curl -sS -o /tmp/dashboard.html -D /tmp/dashboard.headers -w '%{http_code}' http://127.0.0.1:3000/dashboard || true)
          echo "Dashboard unauthenticated status: $dashboard_status"
          cat /tmp/dashboard.headers
          test "$dashboard_status" = "307"
          grep -Eiq '^location: .*/login' /tmp/dashboard.headers
          echo 'Dashboard unauthenticated request redirects to /login'
